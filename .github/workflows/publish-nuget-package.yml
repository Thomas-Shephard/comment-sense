name: Publish NuGet Package

on:
  release:
    types: [ published ]

jobs:
  build-test-and-pack:
    name: Build, Test and Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: Read Target Frameworks
        shell: pwsh
        run: |
          $frameworks = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup
          "BASELINE_SDK_VERSION=$($frameworks.BaselineTargetFramework -replace '^net', '').x" >> $env:GITHUB_ENV
      - name: Setup Current and Baseline .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.BASELINE_SDK_VERSION }}
          dotnet-quality: ga
          cache: true
          cache-dependency-path: |
            CommentSense.slnx
            global.json
            .config/dotnet-tools.json
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj
      - name: Restore Tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build CommentSense.slnx --configuration Release
      - name: Test
        run: dotnet test --solution CommentSense.slnx --configuration Release --no-build --coverlet --results-directory ./coverage
      - name: Check Coverage
        run: dotnet coveragechecker --format Cobertura --glob-patterns 'coverage/**/coverage.cobertura.*.xml' --line-threshold 100 --branch-threshold 100
      - name: Pack
        run: dotnet pack CommentSense.slnx --configuration Release --no-build --output artifacts/package
      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/package/*.nupkg
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  package-consumption:
    needs: build-test-and-pack
    uses: ./.github/workflows/package-consumption.yml

  publish-to-nuget:
    name: Publish to NuGet.org
    needs: package-consumption
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
      - name: Download NuGet Packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/package
      - name: Authenticate with NuGet
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-auth
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/package/*.nupkg" --api-key ${{ steps.nuget-auth.outputs.nuget_api_key }} --source https://api.nuget.org/v3/index.json --skip-duplicate
