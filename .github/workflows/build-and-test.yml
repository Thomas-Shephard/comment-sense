name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PR_TARGET_FRAMEWORK: net10.0

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: |
            CommentSense.slnx
            global.json
            .config/dotnet-tools.json
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj
      - name: Set up JDK 17
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Tools
        run: dotnet tool restore
      - name: Run SonarScanner Begin
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner begin /k:"${{ vars.SONAR_PROJECT_KEY }}" /o:"${{ vars.SONAR_ORGANIZATION }}" /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}" /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.*.xml"
      - name: Build
        run: |
          args=(CommentSense.slnx --configuration Release)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=("-p:SupportedTargetFrameworks=$PR_TARGET_FRAMEWORK")
          fi
          dotnet build "${args[@]}"
      - name: Test
        run: |
          args=(--solution CommentSense.slnx --configuration Release --no-build --coverlet --results-directory ./coverage)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--framework "$PR_TARGET_FRAMEWORK")
          fi
          dotnet test "${args[@]}"
      - name: Run SonarScanner End
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end
      - name: Check Coverage
        run: dotnet coveragechecker --format Cobertura --glob-patterns 'coverage/**/coverage.cobertura.*.xml' --line-threshold 100 --branch-threshold 100
      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack CommentSense.slnx --configuration Release --no-build --output artifacts/package
      - name: Package Consumption Check
        if: github.event_name == 'push'
        shell: pwsh
        run: ./eng/package-consumption-check.ps1
      - name: Upload NuGet Packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/package/*.nupkg
          if-no-files-found: error
          compression-level: 0
