name: Build, Test and Pack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-and-pack:
    name: Build, Test and Pack
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read Target Frameworks
        shell: pwsh
        run: |
          $frameworks = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup
          "BASELINE_SDK_VERSION=$($frameworks.BaselineTargetFramework -replace '^net', '').x" >> $env:GITHUB_ENV
          "CURRENT_TARGET_FRAMEWORK=$($frameworks.CurrentTargetFramework)" >> $env:GITHUB_ENV
      - name: Setup Current and Baseline .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.BASELINE_SDK_VERSION }}
          dotnet-quality: ga
          cache: true
          cache-dependency-path: |
            CommentSense.slnx
            global.json
            .config/dotnet-tools.json
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj
      - name: Set up JDK 17
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Tools
        run: dotnet tool restore
      - name: Run SonarScanner Begin
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner begin /k:"${{ vars.SONAR_PROJECT_KEY }}" /o:"${{ vars.SONAR_ORGANIZATION }}" /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}" /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.*.xml"
      - name: Build
        run: |
          args=(CommentSense.slnx --configuration Release)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=("-p:SupportedTargetFrameworks=$CURRENT_TARGET_FRAMEWORK")
          fi
          dotnet build "${args[@]}"
      - name: Test
        run: |
          args=(--solution CommentSense.slnx --configuration Release --no-build --coverlet --results-directory ./coverage)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--framework "$CURRENT_TARGET_FRAMEWORK")
          fi
          dotnet test "${args[@]}"
      - name: Run SonarScanner End
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end
      - name: Check Coverage
        run: dotnet coveragechecker --format Cobertura --glob-patterns 'coverage/**/coverage.cobertura.*.xml' --line-threshold 100 --branch-threshold 100
      - name: Pack
        run: |
          args=(CommentSense.slnx --configuration Release --no-build --output artifacts/package)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=("-p:SupportedTargetFrameworks=$CURRENT_TARGET_FRAMEWORK")
          fi
          dotnet pack "${args[@]}"
      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/package/*.nupkg
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  package-consumption:
    needs: build-test-and-pack
    uses: ./.github/workflows/package-consumption.yml

  verify:
    name: Verify
    needs: [build-test-and-pack, package-consumption]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Check Results
        env:
          BUILD_RESULT: ${{ needs.build-test-and-pack.result }}
          PACKAGE_RESULT: ${{ needs.package-consumption.result }}
        run: test "$BUILD_RESULT" = success && test "$PACKAGE_RESULT" = success
