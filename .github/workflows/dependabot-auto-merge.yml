name: Dependabot Auto-Merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable Auto-Merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    steps:
      - name: Read Dependabot metadata
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Roslyn update - manual review
        if: contains(steps.dependabot.outputs.dependency-names, 'Microsoft.CodeAnalysis.')
        run: echo "Review and merge this Roslyn update manually."
      - name: Enable GitHub auto-merge
        if: >-
          steps.dependabot.outputs.dependency-names != '' &&
          !contains(steps.dependabot.outputs.dependency-names, 'Microsoft.CodeAnalysis.')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
