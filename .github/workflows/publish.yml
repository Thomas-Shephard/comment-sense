name: Publish NuGet Package

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: |
            CommentSense.slnx
            global.json
            .config/dotnet-tools.json
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj
      - name: Restore Tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build CommentSense.slnx --configuration Release
      - name: Test
        run: dotnet test --solution CommentSense.slnx --configuration Release --no-build --coverlet --results-directory ./coverage
      - name: Check Coverage
        run: dotnet coveragechecker --format Cobertura --glob-patterns 'coverage/**/coverage.cobertura.*.xml' --line-threshold 100 --branch-threshold 100
      - name: Pack
        run: dotnet pack CommentSense.slnx --configuration Release --no-build --output artifacts/package
      - name: Package Consumption Check
        shell: pwsh
        run: ./eng/package-consumption-check.ps1
      - name: Authenticate with NuGet
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-auth
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/package/*.nupkg" --api-key ${{ steps.nuget-auth.outputs.nuget_api_key }} --source https://api.nuget.org/v3/index.json --skip-duplicate
