name: Performance Benchmarks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push_results:
        description: 'Push benchmark results to gh-pages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: |
            CommentSense.slnx
            global.json
            .config/dotnet-tools.json
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj

      - name: Restore Tools
        run: dotnet tool restore

      - name: Ensure gh-pages branch exists
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages --depth=1; then
            echo "gh-pages exists. Tracking locally..."
            git checkout -b gh-pages origin/gh-pages
            git checkout -
          else
            echo "gh-pages branch missing. Initializing..."
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initial benchmark data storage"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
            git checkout -
          fi
      - name: Cleanup previous results
        run: rm -rf BenchmarkDotNet.Artifacts/results

      - name: Run Benchmarks
        run: dotnet run -c Release --project benchmarks/CommentSense.PerformanceTests.csproj -- --filter '*' --exporters BriefJson --iterationCount 10 --warmupCount 5

      - name: Merge Benchmark Results
        run: |
          # Merge all class-specific reports into a single combined report
          shopt -s nullglob
          JSON_FILES=(BenchmarkDotNet.Artifacts/results/*-report-brief.json)
          if [ ${#JSON_FILES[@]} -eq 0 ]; then
            echo "No benchmark reports found!"
            exit 1
          fi

          if [ ${#JSON_FILES[@]} -gt 1 ]; then
            jq -s 'map(select(type == "object" and .Benchmarks and (.Benchmarks | type) == "array")) | .[0] + {Benchmarks: map(.Benchmarks) | add}' BenchmarkDotNet.Artifacts/results/*-report-brief.json > BenchmarkDotNet.Artifacts/results/temp-report.json
          else
            cp "${JSON_FILES[0]}" BenchmarkDotNet.Artifacts/results/temp-report.json
          fi

          # Transform report to use memory allocations instead of time for tracking
          jq '.Benchmarks |= map(.Statistics.Mean = .Memory.BytesAllocatedPerOperation)' BenchmarkDotNet.Artifacts/results/temp-report.json > BenchmarkDotNet.Artifacts/results/combined-report.json

      - name: Store Benchmark Result
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: CommentSense Memory Allocations
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/combined-report.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.push_results) }}
          summary-always: true
          comment-always: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: true
