name: Package Consumption

on:
  workflow_call:

jobs:
  package-consumption:
    name: Package Consumption (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: baseline
            quality: ga
          - role: current
            quality: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download NuGet Packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/package
      - name: Read Target Framework
        id: framework
        shell: pwsh
        env:
          SDK_ROLE: ${{ matrix.role }}
        run: |
          $frameworks = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup
          $framework = $frameworks.($env:SDK_ROLE + 'TargetFramework')
          "sdk-version=$($framework -replace '^net', '').x" >> $env:GITHUB_OUTPUT
      - name: Setup .NET
        id: consumer-sdk
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.framework.outputs.sdk-version }}
          dotnet-quality: ${{ matrix.quality }}
      - name: Package Consumption Check
        shell: pwsh
        env:
          CONSUMER_SDK_VERSION: ${{ steps.consumer-sdk.outputs.dotnet-version }}
        run: ./eng/package-consumption-check.ps1 -SdkVersion $env:CONSUMER_SDK_VERSION
